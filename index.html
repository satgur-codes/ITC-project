<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lens Society | Photography Club Portfolio</title>
  <meta name="description" content="Best member submissions from our college photography club.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top">Lens Society</a>
    <nav aria-label="Main">
      <a href="#gallery">Gallery</a>
      <a href="#submit">Submit</a>
      <a href="#about">About</a>
    </nav>
  </header>
  <main id="top">
    <section class="hero">
      <h1>The best frames from our campus, chosen by members.</h1>
      <p>Browse the club's favourite photographs, like the ones you love, and send in your own.</p>
      <p class="stats"><span id="statPhotos">0</span> photos &nbsp;|&nbsp; <span id="statLikes">0</span> likes</p>
    </section>

    <section id="gallery" class="wrap" aria-labelledby="galleryTitle">
      <div class="head">
        <h2 id="galleryTitle">Gallery</h2>
        <div class="filters" role="group" aria-label="Filter by category"></div>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>No photos in this category yet. Be the first to submit one.</p>
    </section>
</body>
</html>
